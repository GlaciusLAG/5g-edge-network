services:
  edge-django:
    build:
      context: ./edge-node
      dockerfile: Dockerfile
    container_name: edge-django
    working_dir: /app
    ports:
      - "8000:8000"
    volumes:
      - ./edge-node:/app
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASS=${POSTGRES_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - SECRET_KEY=${SECRET_KEY}
    command: sh -c "python manage.py makemigrations telemetria && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    networks:
      - red_dispositivos
      - red_datos
    depends_on:
      - db
      - redis
    labels:
      proyecto: "hospital_5g"
      componente: "nodo_edge"

  db:
    image: postgres:16-alpine
    container_name: nodo_edge_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - red_datos
    labels:
      proyecto: "hospital_5g"
      componente: "infraestructura"

  redis:
    image: redis:7-alpine
    container_name: nodo_edge_redis
    networks:
      - red_datos
    labels:
      proyecto: "hospital_5g"
      componente: "infraestructura"

  ##################
  ## DISPOSITIVOS ##
  ##################
  dispositivo_cardiograma:
    build:
      context: ./dispositivos_medicos
      dockerfile: Dockerfile
    cap_add:
      - NET_ADMIN
    environment:
      - TIPO_DISPOSITIVO=cardiograma
      - EDGE_URL_JSON=http://edge-django:8000/api/telemetria/
      - EDGE_URL_FILE=http://edge-django:8000/api/telemetria/archivo/
    networks:
      - red_dispositivos
    depends_on:
      - edge-django
    labels:
      proyecto: "hospital_5g"
      tipo: "dispositivo_medico"
      especialidad: "cardiologia"

  dispositivo_respirador:
    build:
      context: ./dispositivos_medicos
      dockerfile: Dockerfile
    cap_add:
      - NET_ADMIN
    environment:
      - TIPO_DISPOSITIVO=respirador
      - EDGE_URL_JSON=http://edge-django:8000/api/telemetria/
      - EDGE_URL_FILE=http://edge-django:8000/api/telemetria/archivo/
    networks:
      - red_dispositivos
    depends_on:
      - edge-django
    labels:
      proyecto: "hospital_5g"
      tipo: "dispositivo_medico"
      especialidad: "urgencias"

volumes:
  postgres_data:

networks:
  red_dispositivos:
    driver: bridge
  red_datos:
    driver: bridge
    internal: true
